[project]
name = "pysub"
version = "1.0.0"
description = "Control software for an 8-thruster V-configuration ROV"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tabish Shah Mohsin", email = "tshahmohsin@gmail.com" },
  { name = "Mohammad Ammar" },
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]  # try/except/pass is clearer than contextlib.suppress here

[tool.ruff.lint.isort]
known-first-party = ["config", "input_handler", "kf", "pid", "rov_kinematics", "golden_kinematics", "fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:pygame.*",
]
timeout = 60

[tool.coverage.run]
branch = true
source = ["base_station", "pi", "hardware_tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
