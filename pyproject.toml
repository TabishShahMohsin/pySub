[project]
name = "pysub"
version = "0.1.0"
description = "Control software for an 8-thruster V-configuration ROV"
requires-python = ">=3.9"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]  # try/except/pass is clearer than contextlib.suppress here

[tool.ruff.lint.isort]
known-first-party = ["config", "input_handler", "kf", "pid", "rov_kinematics"]
