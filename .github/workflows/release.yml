name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build bundles
        run: |
          mkdir dist
          zip -r "dist/pysub-base-station-${GITHUB_REF_NAME}.zip" base_station requirements-base-station.txt README.md LICENSE
          zip -r "dist/pysub-pi-${GITHUB_REF_NAME}.zip" pi hardware_tests deploy scripts requirements-pi.txt README.md LICENSE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
